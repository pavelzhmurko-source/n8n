name: n8n-course-kit

services:
  n8n:
    image: n8nio/n8n:3.1.0@sha256:6e9f220e9cf0d2f17d3c2371c8d8a6fe6720f99b82a9672afb96bf068cfd04a5
    restart: unless-stopped
    ports:
      - "127.0.0.1:${COURSEKIT_N8N_PORT:-5678}:5678"
    environment:
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key
      N8N_EDITOR_BASE_URL: "http://127.0.0.1:${COURSEKIT_N8N_PORT:-5678}/"
      N8N_WEBHOOK_URL: "${COURSEKIT_WEBHOOK_URL:-http://127.0.0.1:5678/}"
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: /files
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN_FILE: /run/secrets/runner_auth_token
      NO_PROXY: n8n,proxy,task-runners,localhost,127.0.0.1
      no_proxy: n8n,proxy,task-runners,localhost,127.0.0.1
      GENERIC_TIMEZONE: Europe/Kyiv
      TZ: Europe/Kyiv
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "100"
    volumes:
      - n8n_data:/home/node/.n8n
      - type: bind
        source: ${COURSEKIT_ENCRYPTION_KEY_FILE:?Set COURSEKIT_ENCRYPTION_KEY_FILE}
        target: /run/secrets/n8n_encryption_key
        read_only: true
      - type: bind
        source: ${COURSEKIT_RUNNER_TOKEN_FILE:?Set COURSEKIT_RUNNER_TOKEN_FILE}
        target: /run/secrets/runner_auth_token
        read_only: true
      - type: bind
        source: ${COURSEKIT_IMPORT_DIR:?Set COURSEKIT_IMPORT_DIR}
        target: /coursekit/import
    healthcheck:
      test: ["CMD-SHELL", "wget -Y off -qO- http://127.0.0.1:5678/healthz/readiness >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 20s
    networks:
      - coursekit

  task-runners:
    image: n8nio/runners:3.1.0@sha256:730c78a31b9d5711319fff053a18e98ba5265f11769c88d1917506e9b33d2616
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_started
    entrypoint: ["tini", "--", "/bin/sh", "-c"]
    command:
      - 'export N8N_RUNNERS_AUTH_TOKEN="$$(cat /run/secrets/runner_auth_token)"; exec /usr/local/bin/task-runner-launcher javascript python'
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: "15"
      NO_PROXY: n8n,localhost,127.0.0.1
      no_proxy: n8n,localhost,127.0.0.1
    volumes:
      - type: bind
        source: ${COURSEKIT_RUNNER_TOKEN_FILE:?Set COURSEKIT_RUNNER_TOKEN_FILE}
        target: /run/secrets/runner_auth_token
        read_only: true
    networks:
      - coursekit

  proxy:
    image: nginx:1.30.6-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${COURSEKIT_NGINX_CONFIG:?Set COURSEKIT_NGINX_CONFIG}
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 && kill -0 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - coursekit

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    restart: unless-stopped
    depends_on:
      proxy:
        condition: service_healthy
    command:
      - tunnel
      - --no-autoupdate
      - --protocol
      - http2
      - --url
      - http://proxy:8080
    networks:
      - coursekit

volumes:
  n8n_data:

networks:
  coursekit:
